name: opennotes
description: "OpenNotes: Open-source high-performance cross-platform vector inking & infinite note-taking engine."
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  archive: ^3.6.1
  sqlite3: ^2.4.5
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.0
  pdf: ^3.11.1
  audioplayers: ^6.0.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
